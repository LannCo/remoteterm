version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "friday"
          time: "09:00"
          timezone: "America/Los_Angeles"
      ignore:
          # Patched via patch-package (patches/@xterm+addon-image+*.patch), pinned to an
          # exact version. A Dependabot bump would fail CI (postinstall now errors on a
          # patch/version mismatch) until the patch is regenerated by hand for the new
          # version — bump manually instead.
          - dependency-name: "@xterm/addon-image"
      groups:
          dev-dependencies-patch:
              dependency-type: "development"
              exclude-patterns:
                  - "*storybook*"
                  - "*electron*"
                  - "jotai"
                  - "react"
                  - "@types/react"
                  - "*react-dom"
                  - "*docusaurus*"
              update-types:
                  - "patch"
          dev-dependencies-minor:
              dependency-type: "development"
              exclude-patterns:
                  - "*storybook*"
                  - "*electron*"
                  - "jotai"
                  - "react"
                  - "@types/react"
                  - "*react-dom"
                  - "*docusaurus*"
              update-types:
                  - "minor"

          prod-dependencies-patch:
              dependency-type: "production"
              exclude-patterns:
                  - "*storybook*"
                  - "*electron*"
                  - "jotai"
                  - "react"
                  - "@types/react"
                  - "*react-dom"
                  - "*docusaurus*"
              update-types:
                  - "patch"
          prod-dependencies-minor:
              dependency-type: "production"
              exclude-patterns:
                  - "*storybook*"
                  - "*electron*"
                  - "jotai"
                  - "react"
                  - "@types/react"
                  - "*react-dom"
                  - "*docusaurus*"
              update-types:
                  - "minor"

          storybook-patch:
              patterns:
                  - "*storybook*"
              update-types:
                  - "patch"
          storybook-minor:
              patterns:
                  - "*storybook*"
              update-types:
                  - "minor"
          storybook-major:
              patterns:
                  - "*storybook*"
              update-types:
                  - "major"

          electron-patch:
              patterns:
                  - "*electron*"
              update-types:
                  - "patch"
          electron-minor:
              patterns:
                  - "*electron*"
              update-types:
                  - "minor"
          electron-major:
              patterns:
                  - "*electron*"
              update-types:
                  - "major"

          docusaurus-patch:
              patterns:
                  - "*docusaurus*"
              update-types:
                  - "patch"
          docusaurus-minor:
              patterns:
                  - "*docusaurus*"
              update-types:
                  - "minor"
          docusaurus-major:
              patterns:
                  - "*docusaurus*"
              update-types:
                  - "major"

          react-patch:
              patterns:
                  - "react"
                  - "@types/react"
                  - "*react-dom"
              update-types:
                  - "patch"
          react-minor:
              patterns:
                  - "react"
                  - "@types/react"
                  - "*react-dom"
              update-types:
                  - "minor"
          react-major:
              patterns:
                  - "react"
                  - "@types/react"
                  - "*react-dom"
              update-types:
                  - "major"

          jotai-patch:
              patterns:
                  - "jotai"
              update-types:
                  - "patch"
          jotai-minor:
              patterns:
                  - "jotai"
              update-types:
                  - "minor"
          jotai-major:
              patterns:
                  - "jotai"
              update-types:
                  - "major"
    - package-ecosystem: "gomod"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "friday"
          time: "09:00"
          timezone: "America/Los_Angeles"
    - package-ecosystem: "github-actions"
      directory: "/.github/workflows"
      schedule:
          interval: "weekly"
          day: "friday"
          time: "09:00"
          timezone: "America/Los_Angeles"
