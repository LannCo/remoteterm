<!doctype html>
<meta charset="utf-8">
<title>popup fixture</title>
<style>body{font:14px system-ui;padding:16px} pre{background:#eee;padding:8px}</style>
<h1>window.open fixture</h1>
<button id="feat">open with features (expect popup)</button>
<button id="plain">open plain (expect pane)</button>
<button id="noopener">open with noopener (expect pane)</button>
<button id="blank">open about:blank then navigate (expect popup)</button>
<a href="popup-child.html" target="_blank">target=_blank link (expect pane)</a>
<br><a id="plainlink" href="popup-child.html">plain link, shift-click (expect pane)</a>
<pre id="log"></pre>
<script>
const log = (m) => (document.getElementById("log").textContent += m + "\n");
const child = () => new URL("popup-child.html", location.href).href;
let popup = null;
window.addEventListener("message", (e) => log("message from popup: " + JSON.stringify(e.data)));
function watchClosed() {
    const t = setInterval(() => {
        if (popup == null) return;
        if (popup.closed) { log("window.closed observed true"); clearInterval(t); }
    }, 250);
}
document.getElementById("feat").onclick = () => {
    popup = window.open(child(), "fixturePopup", "width=480,height=600");
    log("open(features) returned " + (popup ? "WindowProxy" : "null"));
    watchClosed();
};
document.getElementById("plain").onclick = () => { window.open(child()); };
document.getElementById("noopener").onclick = () => { window.open(child(), "_blank", "noopener,width=480,height=600"); };
document.getElementById("blank").onclick = () => {
    popup = window.open("about:blank", "fixtureBlank", "width=480,height=600");
    log("open(about:blank) returned " + (popup ? "WindowProxy" : "null"));
    setTimeout(() => { popup.location.href = child(); }, 300);
    watchClosed();
};
</script>
